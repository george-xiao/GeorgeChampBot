[project]
name = "georgechampbot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.7,<3.0",
    "davey>=0.1.5",
    "python-dotenv>=0.21.0",
    "emoji>=1.7.0",
    "aiogoogle>=5.0",
    "yt-dlp>=2026.1.1",
    "PyNaCl>=1.5.0",
    "isodate>=0.6.1",
    "pytz>=2024.1",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "dpytest>=0.7",
    "looptime>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Used by `pytest --cov`
[tool.coverage.run]
source = ["common", "commands", "components", "GeorgeChampBot"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["database"]

# Defaults (E4, E7, E9, F) plus high-signal extras. See docs/TODO.md for
# rule groups we deliberately left out for a future expansion pass.
[tool.ruff.lint]
extend-select = [
    "B",     # flake8-bugbear: real bugs (mutable defaults, raise-from, etc.)
    "UP",    # pyupgrade: modern Python syntax
    "SIM",   # flake8-simplify: readability cleanups
    "PERF",  # perflint: avoidable performance traps
    "RUF",   # ruff-specific checks
]
