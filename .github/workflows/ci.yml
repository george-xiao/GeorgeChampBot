# Gate PRs on the same hooks that run on pre-push (.pre-commit-config.yaml):
# ruff, ruff-format, and the Docker test build + pytest coverage gate.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-push-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
