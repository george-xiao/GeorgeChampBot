# Run on every push: `pre-commit install --hook-type pre-push`
# Run manually:      `pre-commit run --all-files`

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-build
        name: pytest build (docker)
        entry: docker
        args: [build, --target, test, -t, george_champ_bot_test, .]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-run
        name: pytest run (docker)
        entry: docker
        # Coverage gate: fails the push if total coverage drops below 80%.
        args: [run, --rm, george_champ_bot_test, python3, -m, pytest,
               --cov=common, --cov=commands, --cov=components, --cov=GeorgeChampBot,
               --cov-report=term-missing, --cov-fail-under=90]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
