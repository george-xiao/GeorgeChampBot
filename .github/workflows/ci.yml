# Gate PRs on the following checks:
# - ruff,
# - ruff-format,
# - Docker test build,
# - pytest coverage gate and
# - prod image smoke test
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push cancels the still-running CI of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - name: ruff
        run: pre-commit run ruff --all-files --hook-stage pre-push --show-diff-on-failure
      - name: ruff-format
        # Run even if ruff failed, so both results show up
        if: ${{ !cancelled() }}
        run: pre-commit run ruff-format --all-files --hook-stage pre-push --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Layers cached in GitHub Actions, so apt/uv only reinstall when their inputs change
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          tags: george_champ_bot_test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      - name: pytest
        run: pre-commit run pytest-run --all-files --hook-stage pre-push

  prod-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Replaces the prod-build hook: same image and tag, but with layers cached
      - uses: docker/setup-buildx-action@v4
      - name: Build prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          tags: george_champ_bot
          load: true
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      - name: Smoke test
        run: pre-commit run prod-smoke --all-files --hook-stage pre-push
